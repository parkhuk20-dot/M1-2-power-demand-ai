services:
  - type: web
    name: m1-2-power-demand-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # sync: false → 값은 저장소가 아니라 Render 대시보드에서 직접 입력한다
      - key: OPENAI_API_KEY
        sync: false
      # 로컬은 파일 경로, Render는 키 파일 내용(JSON) 전체를 붙여넣는다
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Vercel 배포 후 프론트 주소로 좁힌다
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.7"
